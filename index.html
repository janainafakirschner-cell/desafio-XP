<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema de XP por Turma</title>
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 100vh;
            background: #1e293b;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        @media (min-height: 700px) and (min-width: 500px) {
            .app-container {
                height: 92vh;
                max-height: 850px;
                border-radius: 24px;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
        }

        /* App Header */
        .app-header {
            padding: 16px 20px 10px;
            text-align: center;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .app-header h1 {
            font-size: 1.25rem;
            font-weight: 800;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .step-indicator {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 4px;
            font-weight: 600;
        }

        /* Screen Wrapper */
        .screens-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 16px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transform: translateX(30px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        .screen-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #f1f5f9;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-shrink: 0;
        }

        /* Tela 1: Turmas Grid */
        .turmas-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            flex: 1;
            align-content: center;
        }

        /* Tela 2: Disciplinas Grid (Garantido Sem Scrollbar) */
        .disciplinas-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
            flex: 1;
            min-height: 0; /* Previne estiramento/overflow */
            padding-bottom: 8px;
        }

        /* Buttons Styling */
        .btn-card {
            background: linear-gradient(145deg, #334155, #1e293b);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #f8fafc;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 6px;
            transition: all 0.15s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            user-select: none;
            width: 100%;
            height: 100%;
        }

        .btn-card:hover {
            border-color: #38bdf8;
            transform: translateY(-2px);
            background: linear-gradient(145deg, #475569, #334155);
        }

        .btn-card:active {
            transform: scale(0.96);
            background: #0284c7;
            border-color: #38bdf8;
        }

        .btn-card.selected {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .disciplinas-grid .btn-card {
            font-size: 0.78rem;
            line-height: 1.15;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            word-break: break-word;
        }

        .disciplinas-grid .btn-card i {
            font-size: 1.1rem;
            margin-bottom: 4px;
            color: #38bdf8;
        }

        /* Tela 3: Pontos & Envio */
        .summary-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            text-align: center;
            flex-shrink: 0;
        }

        .summary-item label {
            display: block;
            font-size: 0.7rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .summary-item span {
            font-size: 1.1rem;
            font-weight: 800;
            color: #38bdf8;
        }

        .points-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
            flex: 1;
        }

        .btn-point {
            background: #334155;
            border: 2px solid transparent;
            border-radius: 12px;
            color: #fff;
            font-size: 1.25rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .btn-point.positive {
            color: #4ade80;
        }

        .btn-point.negative {
            color: #f87171;
        }

        .btn-point.selected {
            border-color: #38bdf8;
            background: #1e293b;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        /* Action Buttons */
        .actions-row {
            display: flex;
            gap: 10px;
            margin-top: auto;
            flex-shrink: 0;
        }

        .btn-back {
            background: #475569;
            border: none;
            color: #fff;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }

        .btn-submit {
            flex: 1;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: all 0.15s ease;
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Success Overlay */
        .success-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .success-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .success-icon {
            font-size: 4rem;
            color: #10b981;
            margin-bottom: 16px;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- App Header -->
        <div class="app-header">
            <h1><i class="fa-solid fa-trophy"></i> Desafio XP</h1>
            <div class="step-indicator" id="stepIndicator">ETAPA 1 DE 3: SELECIONE A TURMA</div>
        </div>

        <div class="screens-wrapper">
            
            <!-- TELA 1: SELEÇÃO DA TURMA -->
            <div class="screen active" id="screen1">
                <div class="screen-title">
                    <i class="fa-solid fa-users"></i> Escolha a Turma
                </div>
                <div class="turmas-grid">
                    <button class="btn-card" onclick="selectTurma('1A')">1º A</button>
                    <button class="btn-card" onclick="selectTurma('1B')">1º B</button>
                    <button class="btn-card" onclick="selectTurma('1C')">1º C</button>
                    <button class="btn-card" onclick="selectTurma('1D')">1º D</button>
                    <button class="btn-card" onclick="selectTurma('1E')">1º E</button>
                    <button class="btn-card" onclick="selectTurma('2A')">2º A</button>
                    <button class="btn-card" onclick="selectTurma('2B')">2º B</button>
                    <button class="btn-card" onclick="selectTurma('2C')">2º C</button>
                    <button class="btn-card" onclick="selectTurma('3A')">3º A</button>
                    <button class="btn-card" onclick="selectTurma('3B')">3º B</button>
                    <button class="btn-card" onclick="selectTurma('3C')">3º C</button>
                </div>
            </div>

            <!-- TELA 2: SELEÇÃO DA DISCIPLINA (12 TODAS VISÍVEIS) -->
            <div class="screen" id="screen2">
                <div class="screen-title">
                    <i class="fa-solid fa-book-open"></i> Escolha a Disciplina
                </div>
                <div class="disciplinas-grid">
                    <button class="btn-card" onclick="selectDisciplina('MATEMÁTICA')">
                        <i class="fa-solid fa-calculator"></i> MATEMÁTICA
                    </button>
                    <button class="btn-card" onclick="selectDisciplina('PORTUGUÊS')">
                        <i class="fa-solid fa-font"></i> PORTUGUÊS
                    </button>
                    <button class="btn-card" onclick="selectDisciplina('INGLÊS')">
                        <i class="fa-solid fa-language"></i> INGLÊS
                    </button>
                    <button class="btn-card" onclick="selectDisciplina('ARTES')">
                        <i class="fa-solid fa-palette"></i> ARTES
                    </button>
                    <button class="btn-card" onclick="selectDisciplina('ED. FÍSICA')">
                        <i class="fa-solid fa-futbol"></i> ED. FÍSICA
                    </button>
                    <button class="btn-card" onclick="selectDisciplina('QUÍMICA')">
                        <i class="fa-solid fa-flask"></i> QUÍMICA
                    </button>
                    <button class="btn-card" onclick="selectDisciplina('BIOLOGIA')">
                        <i class="fa-solid fa-dna"></i> BIOLOGIA
                    </button>
                    <button class="btn-card" onclick="selectDisciplina('FÍSICA')">
                        <i class="fa-solid fa-atom"></i> FÍSICA
                    </button>
                    <button class="btn-card" onclick="selectDisciplina('GEOGRAFIA')">
                        <i class="fa-solid fa-earth-americas"></i> GEOGRAFIA
                    </button>
                    <button class="btn-card" onclick="selectDisciplina('HISTÓRIA')">
                        <i class="fa-solid fa-landmark"></i> HISTÓRIA
                    </button>
                    <button class="btn-card" onclick="selectDisciplina('FILOSOFIA')">
                        <i class="fa-solid fa-brain"></i> FILOSOFIA
                    </button>
                    <button class="btn-card" onclick="selectDisciplina('SOCIOLOGIA')">
                        <i class="fa-solid fa-people-group"></i> SOCIOLOGIA
                    </button>
                </div>
                <div class="actions-row">
                    <button class="btn-back" onclick="goToScreen(1)">
                        <i class="fa-solid fa-arrow-left"></i> Voltar
                    </button>
                </div>
            </div>

            <!-- TELA 3: ATRIBUIÇÃO DE PONTOS -->
            <div class="screen" id="screen3">
                <div class="screen-title">
                    <i class="fa-solid fa-star"></i> Atribuir Pontuação
                </div>

                <div class="summary-box">
                    <div class="summary-item">
                        <label>Turma</label>
                        <span id="summaryTurma">-</span>
                    </div>
                    <div class="summary-item">
                        <label>Disciplina</label>
                        <span id="summaryDisciplina">-</span>
                    </div>
                </div>

                <div class="points-grid">
                    <button class="btn-point positive" onclick="selectPontos(50)">+50 XP</button>
                    <button class="btn-point positive" onclick="selectPontos(25)">+25 XP</button>
                    <button class="btn-point positive" onclick="selectPontos(10)">+10 XP</button>
                    <button class="btn-point negative" onclick="selectPontos(-10)">-10 XP</button>
                    <button class="btn-point negative" onclick="selectPontos(-25)">-25 XP</button>
                    <button class="btn-point negative" onclick="selectPontos(-50)">-50 XP</button>
                </div>

                <div class="actions-row">
                    <button class="btn-back" onclick="goToScreen(2)">
                        <i class="fa-solid fa-arrow-left"></i> Voltar
                    </button>
                    <button class="btn-submit" id="btnSubmit" disabled onclick="enviarPontuacao()">
                        <i class="fa-solid fa-paper-plane"></i> ENVIAR XP
                    </button>
                </div>
            </div>

        </div>

        <!-- Tela de Sucesso Overlay -->
        <div class="success-overlay" id="successOverlay">
            <i class="fa-solid fa-circle-check success-icon"></i>
            <h2>Pontos Enviados!</h2>
            <p style="color: #94a3b8; margin-top: 8px;">Planilha atualizada com sucesso.</p>
        </div>
    </div>

    <script>
        // SEU LINK DO GOOGLE APPS SCRIPT
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyzoFi0wv6PmjSwZebmpgo0r97D7TqRnuPjJhaKPgaBZtUyfCjtwiPViuytBMDRDz2-/exec";

        // Estado do Formulário
        let state = {
            turma: '',
            disciplina: '',
            pontos: null
        };

        function goToScreen(screenNum) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen${screenNum}`).classList.add('active');

            const indicator = document.getElementById('stepIndicator');
            if (screenNum === 1) indicator.innerText = "ETAPA 1 DE 3: SELECIONE A TURMA";
            if (screenNum === 2) indicator.innerText = "ETAPA 2 DE 3: SELECIONE A DISCIPLINA";
            if (screenNum === 3) indicator.innerText = "ETAPA 3 DE 3: CONFIRME A PONTUAÇÃO";
        }

        function selectTurma(turma) {
            state.turma = turma;
            document.getElementById('summaryTurma').innerText = turma;
            goToScreen(2);
        }

        function selectDisciplina(disciplina) {
            state.disciplina = disciplina;
            document.getElementById('summaryDisciplina').innerText = disciplina;
            goToScreen(3);
        }

        function selectPontos(pontos) {
            state.pontos = pontos;
            
            // Highlight do botão selecionado
            document.querySelectorAll('.btn-point').forEach(btn => btn.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            
            // Habilita o botão enviar
            document.getElementById('btnSubmit').disabled = false;
        }

        function enviarPontuacao() {
            if (!state.turma || !state.disciplina || state.pontos === null) return;

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ENVIANDO...`;

            const payload = {
                turma: state.turma,
                disciplina: state.disciplina,
                pontos: state.pontos,
                data: new Date().toLocaleString("pt-BR")
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                // Exibe tela de sucesso
                const overlay = document.getElementById('successOverlay');
                overlay.classList.add('active');

                // Reseta estado após 2 segundos
                setTimeout(() => {
                    overlay.classList.remove('active');
                    btnSubmit.innerHTML = `<i class="fa-solid fa-paper-plane"></i> ENVIAR XP`;
                    document.querySelectorAll('.btn-point').forEach(btn => btn.classList.remove('selected'));
                    state = { turma: '', disciplina: '', pontos: null };
                    goToScreen(1);
                }, 2000);
            })
            .catch(err => {
                alert("Erro ao enviar dados. Verifique sua conexão.");
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-paper-plane"></i> ENVIAR XP`;
            });
        }
    </script>
</body>
</html>
