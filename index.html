<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desafio XP Escolar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: #1e293b;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-height: 650px) and (min-width: 480px) {
            .app-container {
                height: 94vh;
                max-height: 800px;
                border-radius: 20px;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
        }

        .app-header {
            padding: 10px 16px 6px;
            text-align: center;
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .app-header h1 {
            font-size: 1.05rem;
            font-weight: 800;
            color: #38bdf8;
            text-transform: uppercase;
        }

        .step-indicator {
            font-size: 0.65rem;
            color: #94a3b8;
            margin-top: 2px;
            font-weight: 600;
        }

        .screens-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transform: translateX(20px);
            transition: all 0.2s ease;
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        .screen-title {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f1f5f9;
            text-align: center;
            flex-shrink: 0;
        }

        /* Grids */
        .turmas-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            flex: 1;
            align-content: center;
        }

        .disciplinas-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 6px;
            flex: 1;
            min-height: 0;
        }

        .btn-card {
            background: linear-gradient(145deg, #334155, #1e293b);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #f8fafc;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px;
            text-transform: uppercase;
            width: 100%;
            height: 100%;
        }

        .btn-card i {
            font-size: 1rem;
            margin-bottom: 2px;
            color: #38bdf8;
        }

        /* Resumo no topo da Tela 3 */
        .summary-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
            padding: 6px 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-around;
            text-align: center;
            flex-shrink: 0;
        }

        .summary-item label {
            display: block;
            font-size: 0.6rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .summary-item span {
            font-size: 0.9rem;
            font-weight: 800;
            color: #38bdf8;
        }

        /* Botões de Ação no Topo da Tela 3 */
        .actions-row-top {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .btn-back {
            background: #475569;
            border: none;
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-submit {
            flex: 1;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-submit:disabled {
            opacity: 0.4;
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
        }

        /* Botões de Pontuação Reduzidos */
        .points-grid-compact {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            flex: 1;
            align-content: start;
        }

        .btn-point {
            background: #334155;
            border: 2px solid transparent;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 4px;
        }

        .btn-point.positive { color: #4ade80; }
        .btn-point.negative { color: #f87171; }
        .btn-point.zero { color: #facc15; }

        .btn-point.selected {
            border-color: #38bdf8;
            background: #1e293b;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        .success-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }

        .success-overlay.active {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="app-header">
            <h1><i class="fa-solid fa-trophy"></i> Desafio XP</h1>
            <div class="step-indicator" id="stepIndicator">ETAPA 1 DE 3: TURMA</div>
        </div>

        <div class="screens-wrapper">
            
            <!-- TELA 1: TURMAS -->
            <div class="screen active" id="screen1">
                <div class="screen-title"><i class="fa-solid fa-users"></i> Escolha a Turma</div>
                <div class="turmas-grid">
                    <button class="btn-card" onclick="selectTurma('1A')">1º A</button>
                    <button class="btn-card" onclick="selectTurma('1B')">1º B</button>
                    <button class="btn-card" onclick="selectTurma('1C')">1º C</button>
                    <button class="btn-card" onclick="selectTurma('1D')">1º D</button>
                    <button class="btn-card" onclick="selectTurma('1E')">1º E</button>
                    <button class="btn-card" onclick="selectTurma('2A')">2º A</button>
                    <button class="btn-card" onclick="selectTurma('2B')">2º B</button>
                    <button class="btn-card" onclick="selectTurma('2C')">2º C</button>
                    <button class="btn-card" onclick="selectTurma('3A')">3º A</button>
                    <button class="btn-card" onclick="selectTurma('3B')">3º B</button>
                    <button class="btn-card" onclick="selectTurma('3C')">3º C</button>
                </div>
            </div>

            <!-- TELA 2: DISCIPLINAS -->
            <div class="screen" id="screen2">
                <div class="screen-title"><i class="fa-solid fa-book-open"></i> Escolha a Disciplina</div>
                <div class="disciplinas-grid">
                    <button class="btn-card" onclick="selectDisciplina('MATEMÁTICA')"><i class="fa-solid fa-calculator"></i> MATEMÁTICA</button>
                    <button class="btn-card" onclick="selectDisciplina('PORTUGUÊS')"><i class="fa-solid fa-font"></i> PORTUGUÊS</button>
                    <button class="btn-card" onclick="selectDisciplina('INGLÊS')"><i class="fa-solid fa-language"></i> INGLÊS</button>
                    <button class="btn-card" onclick="selectDisciplina('ARTES')"><i class="fa-solid fa-palette"></i> ARTES</button>
                    <button class="btn-card" onclick="selectDisciplina('ED. FÍSICA')"><i class="fa-solid fa-futbol"></i> ED. FÍSICA</button>
                    <button class="btn-card" onclick="selectDisciplina('QUÍMICA')"><i class="fa-solid fa-flask"></i> QUÍMICA</button>
                    <button class="btn-card" onclick="selectDisciplina('BIOLOGIA')"><i class="fa-solid fa-dna"></i> BIOLOGIA</button>
                    <button class="btn-card" onclick="selectDisciplina('FÍSICA')"><i class="fa-solid fa-atom"></i> FÍSICA</button>
                    <button class="btn-card" onclick="selectDisciplina('GEOGRAFIA')"><i class="fa-solid fa-earth-americas"></i> GEOGRAFIA</button>
                    <button class="btn-card" onclick="selectDisciplina('HISTÓRIA')"><i class="fa-solid fa-landmark"></i> HISTÓRIA</button>
                    <button class="btn-card" onclick="selectDisciplina('FILOSOFIA')"><i class="fa-solid fa-brain"></i> FILOSOFIA</button>
                    <button class="btn-card" onclick="selectDisciplina('SOCIOLOGIA')"><i class="fa-solid fa-people-group"></i> SOCIOLOGIA</button>
                </div>
                <div style="margin-top: auto; padding-top: 4px;">
                    <button class="btn-back" onclick="goToScreen(1)"><i class="fa-solid fa-arrow-left"></i> Voltar</button>
                </div>
            </div>

            <!-- TELA 3: PONTUAÇÃO (BOTÕES DE AÇÃO NO TOPO) -->
            <div class="screen" id="screen3">
                
                <!-- 1. RESUMO -->
                <div class="summary-box">
                    <div class="summary-item"><label>Turma</label><span id="summaryTurma">-</span></div>
                    <div class="summary-item"><label>Disciplina</label><span id="summaryDisciplina">-</span></div>
                </div>

                <!-- 2. BOTÕES VOLTAR E ENVIAR NO TOPO -->
                <div class="actions-row-top">
                    <button class="btn-back" onclick="goToScreen(2)"><i class="fa-solid fa-arrow-left"></i> Voltar</button>
                    <button class="btn-submit" id="btnSubmit" disabled onclick="enviarPontuacao()"><i class="fa-solid fa-paper-plane"></i> ENVIAR XP</button>
                </div>

                <div class="screen-title" style="font-size: 0.8rem; margin-bottom: 6px;"><i class="fa-solid fa-hand-pointer"></i> Selecione a Pontuação:</div>

                <!-- 3. SELEÇÃO DE PONTOS -->
                <div class="points-grid-compact">
                    <button class="btn-point negative" onclick="selectPontos(-50)">-50 XP</button>
                    <button class="btn-point negative" onclick="selectPontos(-25)">-25 XP</button>
                    <button class="btn-point negative" onclick="selectPontos(-10)">-10 XP</button>
                    
                    <button class="btn-point zero" onclick="selectPontos(0)" style="grid-column: span 3;">0 PONTOS</button>
                    
                    <button class="btn-point positive" onclick="selectPontos(10)">+10 XP</button>
                    <button class="btn-point positive" onclick="selectPontos(25)">+25 XP</button>
                    <button class="btn-point positive" onclick="selectPontos(50)">+50 XP</button>
                </div>

            </div>

        </div>

        <div class="success-overlay" id="successOverlay">
            <i class="fa-solid fa-circle-check" style="font-size: 3.5rem; color: #10b981; margin-bottom: 12px;"></i>
            <h2>Pontos Enviados!</h2>
            <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 4px;">Planilha atualizada.</p>
        </div>
    </div>

    <script>
        // COLE SUA URL DO GOOGLE APPS SCRIPT AQUI ABAIXO:
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx7LZonanqTSeln4CBgvtoWgLa_n01cLV106dilbCoMNXnNHDlu-pifzs5PZt3eQt7y/exec ";

        let state = { turma: '', disciplina: '', pontos: null };

        function goToScreen(screenNum) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen${screenNum}`).classList.add('active');

            const indicator = document.getElementById('stepIndicator');
            if (screenNum === 1) indicator.innerText = "ETAPA 1 DE 3: TURMA";
            if (screenNum === 2) indicator.innerText = "ETAPA 2 DE 3: DISCIPLINA";
            if (screenNum === 3) indicator.innerText = "ETAPA 3 DE 3: PONTUAÇÃO";
        }

        function selectTurma(turma) {
            state.turma = turma;
            document.getElementById('summaryTurma').innerText = turma;
            goToScreen(2);
        }

        function selectDisciplina(disciplina) {
            state.disciplina = disciplina;
            document.getElementById('summaryDisciplina').innerText = disciplina;
            
            // Reseta a pontuação ao entrar na Tela 3
            state.pontos = null;
            document.querySelectorAll('.btn-point').forEach(btn => btn.classList.remove('selected'));
            document.getElementById('btnSubmit').disabled = true;

            goToScreen(3);
        }

        function selectPontos(pontos) {
            state.pontos = pontos;
            
            // Marca o botão escolhido com destaque
            document.querySelectorAll('.btn-point').forEach(btn => btn.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            
            // LIBERA O BOTÃO DE ENVIAR
            document.getElementById('btnSubmit').disabled = false;
        }

        function enviarPontuacao() {
            if (!state.turma || !state.disciplina || state.pontos === null) return;

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ENVIANDO...`;

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(state)
            })
            .then(() => {
                const overlay = document.getElementById('successOverlay');
                overlay.classList.add('active');

                setTimeout(() => {
                    overlay.classList.remove('active');
                    btnSubmit.innerHTML = `<i class="fa-solid fa-paper-plane"></i> ENVIAR XP`;
                    document.querySelectorAll('.btn-point').forEach(btn => btn.classList.remove('selected'));
                    state = { turma: '', disciplina: '', pontos: null };
                    goToScreen(1);
                }, 1500);
            })
            .catch(err => {
                alert("Erro ao enviar dados.");
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-paper-plane"></i> ENVIAR XP`;
            });
        }
    </script>
</body>
</html>
